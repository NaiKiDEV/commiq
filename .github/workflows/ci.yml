name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - refactor/v2

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm/action-setup v4.4.0 — deliberately no `version:` input so the pnpm
      # version is read from the root package.json `packageManager` field
      # (pnpm@10.28.1).
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      # Must run after `build`: per-package tsconfigs resolve @naikidev/* through
      # node_modules symlinks to dist/index.d.ts, which only exists post-build.
      - name: Typecheck packages
        run: pnpm typecheck

      # Covers root-only sources (tooling/), which `pnpm -r typecheck` never sees.
      - name: Typecheck root tooling
        run: pnpm typecheck:root

      - name: Test
        run: pnpm test
